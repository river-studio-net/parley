syntax = "proto3";
package message_service;


import "proto/parley.proto";


message SendMessageResult {
  oneof result {
    string message_id = 1;
    string err = 2; 
  }
}

message GetMessagesRequest {
  string channel_id = 1;
}

service MessageService {
  rpc SendMessage (models.TextMessage) returns (MessageRequestResult);
  rpc GetMessages (GetMessagesRequest) returns (stream models.TextMessage);
}
